<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretya - Birthday Special</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6e6, #ffb3d9);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #ff4d94;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        /* Photo Section Styles */
        .photo-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.15);
            margin-bottom: 20px;
        }

        .photo-display {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 3px solid #ffb3d9;
        }

        /* Music Player Styles */
        .music-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.15);
        }

        .music-title {
            font-weight: bold;
            color: #ff4d94;
            margin-bottom: 15px;
            font-size: 1.1rem;
            word-wrap: break-word;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
        }

        /* Common Upload Button Styles */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin: 5px;
        }

        .btn {
            border: 2px dashed #ff4d94;
            color: #ff4d94;
            background-color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ff4d94;
            color: white;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday, Pretya! 🎉</h1>
        <p>6 June - Wishing you a wonderful year ahead! ❤️</p>

        <div class="photo-card">
            <img id="birthdayPhoto" src="1000085232.jpg" alt="Birthday Celebration" class="photo-display">
            
            <div class="upload-btn-wrapper">
                <button class="btn">📸 Change Photo</button>
                <input type="file" id="photoUpload" accept="image/*" />
            </div>
        </div>

        <div class="music-card">
            <div class="music-title" id="musicName">🎵 Playing: birthday-music-birthday-music.mp2(48k).mp3</div>
            
            <audio id="audioPlayer" controls>
                <source id="audioSource" src="birthday-music-birthday-music.mp2(48k).mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div class="upload-btn-wrapper">
                <button class="btn">🎵 Change Music</button>
                <input type="file" id="musicUpload" accept="audio/*" />
            </div>
        </div>
    </div>

    <script>
        // Photo Update Logic
        const photoUpload = document.getElementById('photoUpload');
        const birthdayPhoto = document.getElementById('birthdayPhoto');

        photoUpload.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length > 0) {
                const file = files[0];
                const imageURL = URL.createObjectURL(file);
                birthdayPhoto.src = imageURL;
            }
        });

        // Music Update Logic
        const musicUpload = document.getElementById('musicUpload');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const musicName = document.getElementById('musicName');

        musicUpload.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length > 0) {
                const file = files[0];
                const fileURL = URL.createObjectURL(file);
                
                audioSource.src = fileURL;
                musicName.textContent = `🎵 Playing: ${file.name}`;
                
                audioPlayer.load();
                audioPlayer.play();
            }
        });
    </script>

</body>
</html>
